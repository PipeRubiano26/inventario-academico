{% extends 'base.html' %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-body">

        <h2 class="mb-4">
            Formulario Producto
        </h2>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="btn btn-success">

                Guardar
            </button>

            <a href="{% url 'lista_productos' %}"
               class="btn btn-secondary">

                Volver
            </a>

        </form>

    </div>

</div>

{% endblock %}
