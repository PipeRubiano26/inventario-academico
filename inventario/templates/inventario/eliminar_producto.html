{% extends 'base.html' %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-body text-center">

        <h2 class="text-danger">
            Eliminar Producto
        </h2>

        <p class="mt-3">
            ¿Deseas eliminar "{{ object.nombre }}"?
        </p>

        <form method="post">

            {% csrf_token %}

            <button type="submit"
                    class="btn btn-danger">

                Sí, eliminar
            </button>

            <a href="{% url 'lista_productos' %}"
               class="btn btn-secondary">

                Cancelar
            </a>

        </form>

    </div>

</div>

{% endblock %}
